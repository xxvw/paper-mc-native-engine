name: MCNE baseline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install checksum-locked Temurin JDK
        run: |
          JDK_HOME=$(python3 scripts/mcne/install_jdk.py --target linux-x86_64)
          echo "JAVA_HOME=$JDK_HOME" >> "$GITHUB_ENV"
          echo "$JDK_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify baseline and publication exclusions
        run: |
          python3 scripts/mcne/verify_upstream.py
          python3 scripts/mcne/check_publication.py
          python3 -m unittest discover -s tests -p 'test_baseline.py' -v
      - name: Verify snapshot canonicalization
        run: |
          python3 -m venv .tools/compat-venv
          .tools/compat-venv/bin/python -m pip install -r compat-tests/requirements.txt
          .tools/compat-venv/bin/python -m unittest discover -s compat-tests -p 'test_*.py' -v
      - name: Discover pinned upstream tasks
        run: ./gradlew tasks --all
      - name: Configure patch Git identity
        run: |
          git config --global user.name 'MCNE CI'
          git config --global user.email 'mcne-ci@users.noreply.github.com'
      - name: Apply maintained patches
        run: ./gradlew applyPatches
      - name: Build unchanged fork
        run: ./gradlew createPaperclipJar
      # No upstream publishing, binary release or equivalence assertion here.
